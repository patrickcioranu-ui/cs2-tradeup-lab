name: Deploy TradeUp Lab to GitHub Pages

# Builds fresh skin + price data and publishes site/ to Pages.
# Data is never committed: each run fetches it and ships it inside the Pages
# artifact (every hour). If the data refresh fails, the deploy is skipped and the previous
# live site (with its last good data) stays up.

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build skin catalog and CSFloat price data
        run: python scripts/update_data.py

      - name: Refresh CSFloat price ladders (uses the CSFLOAT_API_KEY secret; skipped without it)
        continue-on-error: true
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
          LADDER_BUDGET: "300"
        run: |
          node scripts/ladder_targets.mjs > "$RUNNER_TEMP/ladder_targets.json"
          python scripts/update_ladders.py "$RUNNER_TEMP/ladder_targets.json"

      - name: Version-stamp assets so browsers never mix old and new files
        run: python scripts/stamp_assets.py site "${GITHUB_SHA::7}-${GITHUB_RUN_ID}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
